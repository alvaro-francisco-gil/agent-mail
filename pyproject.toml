[project]
name = "agent-mail"
version = "0.1.0"
description = "Read-only MCP server over a personal mailbox. Outlook first, Gmail second."
requires-python = ">=3.11"
dependencies = ["mcp>=1.2"]

[project.scripts]
agent-mail = "agent_mail.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_mail"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Live tests reach the real mail servers, so they never run by accident:
# `pytest -m live` overrides this, since the last -m wins.
addopts = "-m 'not live'"
markers = ["live: talks to a real mail server, read-only; run with -m live"]
