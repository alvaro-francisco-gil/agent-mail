[project]
name = "agent-mail"
version = "0.1.0"
description = "Read-only MCP server over a personal mailbox. Outlook first, Gmail second."
requires-python = ">=3.11"
dependencies = ["mcp>=1.2"]

[project.scripts]
agent-mail = "agent_mail.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_mail"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
